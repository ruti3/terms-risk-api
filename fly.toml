# fly.toml app configuration file generated for terms-risk-api on 2026-07-15T14:10:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'terms-risk-api'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'terms_risk_data'
  destination = '/app/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
